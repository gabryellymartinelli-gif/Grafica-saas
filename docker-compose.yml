services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grafica_saas
      MYSQL_USER: grafica
      MYSQL_PASSWORD: grafica
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ugrafica", "-pgrafica"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
